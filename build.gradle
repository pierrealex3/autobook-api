plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.27.0'
}

group = 'org.palemire'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.8"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-jackson2'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'de.huxhorn.sulky:de.huxhorn.sulky.ulid:8.3.0'

	implementation 'org.mapstruct:mapstruct:1.6.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'


	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

}

openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$rootDir/src/main/resources/openapi/autobook.yaml"
	outputDir = "$buildDir/generated/openapi"
	apiPackage = 'org.palemire.autobook.api'
	modelPackage = 'org.palemire.autobook.dto'
	configOptions = [
		interfaceOnly: 'true',
		useSpringBoot3: 'true',
		useTags: 'true',
		useResponseEntity: 'true',
		skipDefaultInterface: 'true',
		requestMappingMode: 'api_interface',
		annotationLibrary: 'none',
		documentationProvider: 'none',
		dateLibrary: 'java8-localdatetime',
		useBeanValidation: 'false',
		useOptional: 'false',
		openApiNullable: 'false',
		generateJsonIncludeAnnotations: 'false'
	]
}

sourceSets.main.java.srcDir("$buildDir/generated/openapi/src/main/java")
tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('test') {
	useJUnitPlatform()
}
