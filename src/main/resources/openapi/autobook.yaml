openapi: 3.0.3
info:
  title: Autobook API
  version: 1.0.0
servers:
  - url: /autobook
tags:
  - name: Vehicle
paths:
  /vehicles:
    get:
      operationId: getAllVehicles
      tags: [Vehicle]
      parameters:
        - name: X-MockUser
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vehicles accessible to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleDto'
  /vehicles/{vehicleId}/appointment:
    post:
      operationId: createAppointment
      tags: [Vehicle]
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentDtoReq'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreatedDto'
  /appointments/{appointmentId}:
    get:
      operationId: getAppointment
      tags: [Vehicle]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDtoRes'
    put:
      operationId: modifyAppointment
      tags: [Vehicle]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentDtoReq'
      responses:
        '204':
          description: Appointment updated
  /events:
    get:
      operationId: getAllEvents
      tags: [Vehicle]
      parameters:
        - name: X-MockUser
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Events accessible to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventDto'
components:
  schemas:
    AppointmentCreatedDto:
      type: object
      properties:
        xid:
          type: string
    AppointmentDtoReq:
      type: object
      properties:
        title:
          type: string
        note:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        appointmentWorkItems:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentWorkItemDtoReq'
        appointmentNotes:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentNoteDto'
    AppointmentDtoRes:
      type: object
      properties:
        title:
          type: string
        note:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        appointmentWorkItems:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentWorkItemDtoRes'
        appointmentNotes:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentNoteDto'
    AppointmentNoteDto:
      type: object
      properties:
        note:
          type: string
    AppointmentWorkItemDtoReq:
      type: object
      properties:
        title:
          type: string
        appointmentWorkItemsLabor:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentWorkItemLaborDto'
        pieceOperations:
          type: array
          items:
            $ref: '#/components/schemas/PieceOperationDtoReq'
    AppointmentWorkItemDtoRes:
      type: object
      properties:
        title:
          type: string
        appointmentWorkItemsLabor:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentWorkItemLaborDto'
        pieceOperations:
          type: array
          items:
            $ref: '#/components/schemas/PieceOperationDtoRes'
    AppointmentWorkItemLaborDto:
      type: object
      properties:
        title:
          type: string
        hoursWorked:
          type: number
        cost:
          type: number
    PieceOperationDtoReq:
      type: object
      required: [type, performedAt]
      discriminator:
        propertyName: type
        mapping:
          buy: '#/components/schemas/PieceOperationBuyDtoReq'
          install: '#/components/schemas/PieceOperationInstallDtoReq'
          repair: '#/components/schemas/PieceOperationRepairDtoReq'
          sell: '#/components/schemas/PieceOperationSellDtoReq'
          thrash: '#/components/schemas/PieceOperationThrashDtoReq'
      properties:
        type:
          type: string
        cost:
          type: number
        performedAt:
          type: string
          format: date-time
        pieceKindReq:
          $ref: '#/components/schemas/PieceKindDtoReq'
    PieceKindDtoReq:
      type: object
      required: [kind]
      discriminator:
        propertyName: kind
        mapping:
          new: '#/components/schemas/PieceKindNewDtoReq'
          existing: '#/components/schemas/PieceKindExistingDtoReq'
      properties:
        kind:
          type: string
    PieceKindNewDtoReq:
      allOf:
        - $ref: '#/components/schemas/PieceKindDtoReq'
      properties:
        piece:
          $ref: '#/components/schemas/PieceDtoReq'
    PieceKindExistingDtoReq:
      allOf:
        - $ref: '#/components/schemas/PieceKindDtoReq'
      properties:
        pieceXid:
          type: string
    PieceDtoReq:
      type: object
      required: [part_number, category, type]
      discriminator:
        propertyName: type
        mapping:
          part: '#/components/schemas/PieceBrakeDtoReq'
          fluid: '#/components/schemas/PieceWiperDtoReq'
      properties:
        type:
          type: string
        part_number:
          type: string
        brand:
          type: string
        model:
          type: string
        category:
          type: string
        tag:
          type: string
        km_life:
          type: integer
        days_life:
          type: integer
    PieceBrakeDtoReq:
        allOf:
            - $ref: '#/components/schemas/PieceDtoReq'
    PieceWiperDtoReq:
        allOf:
            - $ref: '#/components/schemas/PieceDtoReq'
    PieceOperationBuyDtoReq:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoReq'
    PieceOperationInstallDtoReq:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoReq'
    PieceOperationRepairDtoReq:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoReq'
    PieceOperationSellDtoReq:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoReq'
    PieceOperationThrashDtoReq:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoReq'
    PieceOperationDtoRes:
      type: object
      required: [type, performedAt]
      discriminator:
        propertyName: type
        mapping:
          buy: '#/components/schemas/PieceOperationBuyDtoRes'
          install: '#/components/schemas/PieceOperationInstallDtoRes'
          repair: '#/components/schemas/PieceOperationRepairDtoRes'
          sell: '#/components/schemas/PieceOperationSellDtoRes'
          thrash: '#/components/schemas/PieceOperationThrashDtoRes'
      properties:
        type:
          type: string
        cost:
          type: number
        performedAt:
          type: string
          format: date-time
        piece:
          $ref: '#/components/schemas/PieceSummaryDto'
    PieceOperationBuyDtoRes:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoRes'
    PieceOperationInstallDtoRes:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoRes'
    PieceOperationRepairDtoRes:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoRes'
    PieceOperationSellDtoRes:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoRes'
    PieceOperationThrashDtoRes:
      allOf:
        - $ref: '#/components/schemas/PieceOperationDtoRes'
    PieceSummaryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        partNumber:
          type: string
        category:
          type: string
    VehicleDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
        tag:
          type: string
    CUDVehicleDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
        tag:
          type: string
    EventDto:
      type: object
      properties:
        eventTargetId:
          type: integer
          format: int32
        eventTargetXid:
          type: string
        vehicleId:
          type: integer
          format: int32
        vehicleTag:
          type: string
        date:
          type: string
        title:
          type: string
        eventType:
          type: string
